name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & test (.NET 8)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Test (Core)
        run: >
          dotnet test tests/FileFlow.Core.Tests --no-build -c Release
          --logger "trx;LogFileName=core.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"

      - name: Test (Infrastructure)
        run: >
          dotnet test tests/FileFlow.Infrastructure.Tests --no-build -c Release
          --logger "trx;LogFileName=infrastructure.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

      - name: Publish framework-dependent build
        run: >
          dotnet publish src/FileFlow.App -c Release -r win-x64 --self-contained false
          -p:PublishReadyToRun=false -o artifacts/app

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileFlow-win-x64
          path: artifacts/app
          retention-days: 14

  screenshots:
    name: Regenerate screenshots (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/FileFlow.App -c Release

      - name: Create demo data
        shell: pwsh
        run: ./scripts/create-demo-data.ps1

      - name: Capture English screenshots
        shell: pwsh
        run: >
          ./src/FileFlow.App/bin/Release/net8.0-windows/FileFlow.App.exe
          --datadir "$env:RUNNER_TEMP/ff-en" --lang en
          --capture-scan demo-data --capture docs/screenshots/en

      - name: Capture Chinese screenshots
        shell: pwsh
        run: >
          ./src/FileFlow.App/bin/Release/net8.0-windows/FileFlow.App.exe
          --datadir "$env:RUNNER_TEMP/ff-zh" --lang zh-CN
          --capture-scan demo-data --capture docs/screenshots/zh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          retention-days: 14
